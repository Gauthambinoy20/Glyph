# Production compose used by the deploy workflow on the target VM (Lightsail / EC2).
# Unlike docker-compose.yml (which builds locally), this PULLS pre-built images from
# GHCR so the small box never has to compile anything. IMAGE_TAG is set by the deploy
# job to the released git SHA; LLM_API_KEY comes from a .env file on the box.
services:
  backend:
    image: ghcr.io/gauthambinoy20/glyph-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b:free}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-openai/gpt-oss-20b:free}
      - CHROMA_DIR=/data/chroma
      # Public box hardening: confine local ingestion + cap requests per client IP.
      - INGEST_BASE_DIR=/app
      - RATE_LIMIT_PER_MINUTE=120
      # Small-box performance tuning. The 2-vCPU host was pegging for ~14s per question because
      # it reranked 60 full-length chunks across both cores. Rerank a tighter pool (24) of trimmed
      # chunks, and cap the ONNX math to a single core so a question can never freeze the whole
      # box — the other core stays free to answer the next one (so follow-ups don't time out).
      - RERANK_CANDIDATES=24
      - EMBED_THREADS=1
      - OMP_NUM_THREADS=1
    volumes:
      - glyph-data:/data
    expose:
      - "8000"

  frontend:
    image: ghcr.io/gauthambinoy20/glyph-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Serve on the standard web port so the public URL needs no :5173 suffix.
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  glyph-data:
