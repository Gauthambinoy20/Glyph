server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bounce plain HTTP to HTTPS. The host-level Caddy terminates TLS and proxies in with
    # X-Forwarded-Proto=https; a request that arrives without it came in directly over HTTP on
    # :80, so 301 it to the secure URL. Cert renewal runs through Caddy on :443 (not here).
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Serve the single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service. To the browser this is same-origin, so no
    # CORS is involved.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass the real client IP through so the backend can rate-limit per client.
        # nginx sets these from the actual connection, so a client cannot spoof them.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Turn buffering off so streamed answers (Server-Sent Events) reach the browser
        # as they are written, not all at once at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
