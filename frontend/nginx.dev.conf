server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Local-dev serving (mounted only by the root docker-compose.yml). Unlike the production
    # nginx.conf, there is NO http->https redirect here: there is no Caddy/TLS terminator in
    # the local compose stack, so `docker compose up` must serve the app directly over plain
    # http://localhost:5173. The production image keeps nginx.conf (with the redirect) untouched.

    # Serve the single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service. To the browser this is same-origin, so no
    # CORS is involved.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass the real client IP through so the backend can rate-limit per client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Turn buffering off so streamed answers (Server-Sent Events) reach the browser
        # as they are written, not all at once at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # The backend warms its models on startup (~30-60s); hand back a friendly JSON instead
        # of a raw 502 page while it is briefly unreachable.
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"detail":"Glyph is updating or briefly busy — please try again in a few seconds."}';
    }
}
