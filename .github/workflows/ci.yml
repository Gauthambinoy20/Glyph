name: CI

# Run the full quality gate on every push and pull request.
on:
  push:
  pull_request:

# Least privilege: the quality gate only ever needs to read the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run, so we never burn
# minutes finishing a build that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy app

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r app -q

      - name: Dependency audit (pip-audit)
        # chromadb CVE-2026-45829 has no fixed release yet; remove this ignore once it does.
        run: pip-audit --ignore-vuln CVE-2026-45829

      - name: Dead code (vulture)
        # Whole-package unused-code check; settings live in [tool.vulture] in pyproject.toml.
        run: vulture

      - name: Tests + coverage
        # Skip integration tests that download the real model (HuggingFace rate-limits CI runners).
        # They run locally; the offline suite still covers the embed/store/cache logic here.
        run: pytest --cov=app --cov-report=term-missing -m "not integration"

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm)
        # Audit only what actually ships. Dev-tooling advisories (e.g. the Vitest
        # UI server, which never runs in CI or production) are out of scope here.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Dead-code check (knip)
        # Flags unused dependencies and unreachable files. Export/type-level
        # checks are off by design — too noisy for the value.
        run: npm run knip

      - name: Types (tsc)
        run: npx tsc -b

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build
