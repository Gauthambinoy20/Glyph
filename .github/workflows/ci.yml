name: CI

# Run the full backend quality gate on every push and pull request.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy app

      - name: Security scan (bandit)
        run: bandit -r app -q

      - name: Dependency audit (pip-audit)
        # chromadb CVE-2026-45829 has no fixed release yet; remove this ignore once it does.
        run: pip-audit --ignore-vuln CVE-2026-45829

      - name: Tests + coverage
        run: pytest --cov=app --cov-report=term-missing
