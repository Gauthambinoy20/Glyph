name: Infra

# Validate the Terraform that provisions the AWS deploy target. Runs on every push and PR so a
# broken or unformatted infra change is caught before it is ever applied. Keeps least-privilege
# permissions and cancels superseded runs, like the other workflows.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt + validate + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend — validation only, never touches real state)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: Lint (tflint)
        run: |
          tflint --init
          tflint --format compact

      # Surface IaC misconfigurations (over-open security-group rules, missing instance hardening)
      # in the Terraform. Report-only for now (exit-code 0): it is being introduced on a live,
      # already-applied stack, so the first runs let us triage the findings and document the
      # intentionally-public demo rules (port 80/443) before flipping it to a hard gate.
      - name: IaC misconfig scan (Trivy, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
