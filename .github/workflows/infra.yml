name: Infra

# Validate the Terraform that provisions the AWS deploy target. Runs on every push and PR so a
# broken or unformatted infra change is caught before it is ever applied. Keeps least-privilege
# permissions and cancels superseded runs, like the other workflows.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt + validate + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend — validation only, never touches real state)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: Lint (tflint)
        run: |
          tflint --init
          tflint --format compact

      # Scan the Terraform for security misconfigurations and FAIL on any unaccepted CRITICAL/HIGH
      # finding. The intentionally-public demo rules and the throwaway-box trade-offs are listed,
      # each with a documented reason, in infra/.trivyignore — so a NEW misconfiguration (e.g. a
      # database suddenly opened to the world) turns this red, while the known, accepted ones don't.
      - name: IaC misconfig scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          trivyignores: infra/.trivyignore
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
