name: Eval

# Real retrieval-quality measurement. Unlike CI (which is offline and runs on every push),
# this clones real public repos and runs the real embedding models + cross-encoder, so it is
# slow and network-heavy. It runs on demand and weekly — never on push — so a retrieval
# regression shows up as a dropped hit-rate rather than slipping through unnoticed.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday

# Least privilege: cloning the golden repos and reading the code is all this needs.
permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: true

jobs:
  eval:
    name: Retrieval quality (real repos, both modes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Cache the embedding / reranker model downloads so weekly runs don't re-fetch them
      # (and are far less likely to hit a HuggingFace rate limit on a fresh runner).
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            backend/.model_cache
          key: eval-models-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the real cross-language eval
        # The floor turns a retrieval regression into a red build (measured overall is ~76% in
        # both modes, so 65% leaves headroom for minor model/version variance). pipefail makes the
        # runner's non-zero exit survive the `tee` pipe instead of being swallowed.
        env:
          EVAL_MIN_HIT_RATE: "0.65"
        run: |
          set -o pipefail
          python -m app.quality.evaluate_repos | tee eval_output.txt

      - name: Publish the hit-rate table to the run summary
        if: always()
        run: |
          {
            echo '### Glyph retrieval quality — real repos × mode'
            echo '```'
            cat eval_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval_report.json
